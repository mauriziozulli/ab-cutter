name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - "claude/**"

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Build release
        run: swift build -c release
